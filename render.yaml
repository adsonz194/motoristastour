services:
  - type: web
    name: motoristastour
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: TOUR_DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: operational-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
